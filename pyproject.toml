[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AutoGator"
version = "0.3.0"
description = "A software package for camera-assisted motion control of PIC chip interrogation platforms."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Sequoia Ploeg", email = "sequoia.ploeg@byu.edu" },
]
maintainers = [
    { name = "Sequoia Ploeg", email = "sequoia.ploeg@byu.edu" },
]
keywords = [
    "PIC",
    "photonic integrated circuit",
    "Pyro",
    "Pyro5",
    "PyroLab",
    "framework",
    "hardware",
    "instrument",
    "instrumentation",
    "integration",
    "lab",
    "laboratory",
    "network",
    "remote",
    "resources",
    "science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "appdirs",
    # circuits.py reads GDS files with gdstk at module scope, and
    # autogator/__init__.py imports circuits, so it is needed to import the
    # package at all.
    "gdstk",
    "keyboard",
    "matplotlib",
    "numpy>=1.22",
    # controllers.py imports cv2 at module scope. This was missing from
    # requirements.txt entirely, so the dependency was undeclared.
    "opencv-python",
    # controllers.py imports PySide6 at module scope.
    "PySide6",
    # controllers.py uses BaseSettings, which pydantic 2 moved to the separate
    # pydantic-settings package.
    "pydantic>=2.8,<3",
    "pydantic-settings>=2,<3",
    # The `rto` extra supplies pyvisa, which hardware.py needs to construct a
    # pyrolab RTO driver directly. pyrolab 0.2.1 depended on pyvisa outright;
    # 0.4.0 moved the per-instrument drivers behind extras, so it must be asked
    # for explicitly now.
    "pyrolab[rto]",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/BYUCamachoLab/autogator"
Documentation = "https://autogator.readthedocs.io/"
Source = "https://github.com/BYUCamachoLab/autogator"
Tracker = "https://github.com/BYUCamachoLab/autogator/issues"
"Research Group" = "https://camacholab.byu.edu/"

# [project.scripts]
# autogator = "autogator.cli:app"

[dependency-groups]
docs = [
    "zensical",
    "mkdocstrings-python",
]
dev = [
    { include-group = "docs" },
    "isort>=5.10",
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["autogator"]

[tool.isort]
profile = "black"
extend_skip_glob = "api.py"
known_first_party = ["autogator"]
known_third_party = [
    "PySide6",
    "appdirs",
    "cv2",
    "gdstk",
    "keyboard",
    "matplotlib",
    "numpy",
    "pydantic",
    "pydantic_settings",
    "pyrolab",
    "pytest",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# TEMPORARY, until pyrolab is released with pydantic 2 (BYUCamachoLab/pyrolab#96):
# resolve pyrolab from git so this can be developed and tested now. PyPI users
# never see this; remove it (and require that pyrolab release) before releasing
# AutoGator, or installs from PyPI would get pyrolab 0.4.0, which needs pydantic 1.
[tool.uv.sources]
pyrolab = { git = "https://github.com/BYUCamachoLab/pyrolab", rev = "914f9717128fe7296736e9ca9e22f4cbac958a34" }
